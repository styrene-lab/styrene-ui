[package]
name = "styrene-ui-apple-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-channel.workspace = true
futures-lite = "2"
styrene-ui-platform.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
block2 = { version = "=0.6.2", default-features = false, features = ["alloc"] }
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-core-bluetooth = { version = "=0.3.2", default-features = false, features = ["bitflags", "CBAttribute", "CBCentralManager", "CBCharacteristic", "CBManager", "CBPeer", "CBPeripheral", "CBService", "CBUUID", "dispatch2"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSData", "NSDate", "NSDictionary", "NSError", "NSFileManager", "NSNotification", "NSOperation", "NSObject", "NSProcessInfo", "NSString", "NSURL", "NSUserDefaults", "block2"] }
objc2-local-authentication = { version = "=0.3.2", default-features = false, features = ["LAContext", "LAError", "block2", "std"] }
objc2-ui-kit = { version = "=0.3.2", default-features = false, features = ["UIActivity", "UIActivityViewController", "UIApplication", "UIContentSizeCategory", "UIDocumentPickerViewController", "UIPasteboard", "UIPopoverPresentationController", "UIPresentationController", "UIResponder", "UIView", "UIViewController", "UIWindow", "block2", "objc2-core-foundation"] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["block2", "UNNotificationSettings", "UNUserNotificationCenter"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
