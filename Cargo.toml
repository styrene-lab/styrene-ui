[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "apps/mobile",
    "apps/mobile-android",
    "apps/mobile-ios",
    "crates/styrene-ui-apple-bridge",
    "crates/styrene-ui-app",
    "crates/styrene-ui-platform",
    "crates/styrene-ui-state",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/styrene-lab/styrene-ui"
authors = ["Styrene Labs"]

[workspace.dependencies]
async-channel = "2"
async-trait = "0.1"
base64 = "0.22"
dioxus = { version = "=0.8.0-alpha.1", default-features = false, features = ["html", "macro", "signals"] }
dioxus-ssr = { version = "=0.8.0-alpha.1", default-features = false }
futures-util = "0.3"
hex = "0.4"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
log = "0.4.27"
rand_core = "0.6.4"
qrcode = { version = "0.14", default-features = false }
quircs = "=0.10.3"
rmp-serde = "1.3.0"
rmpv = { version = "1.3.0", features = ["with-serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
styrene-interop-runner = { git = "https://github.com/styrene-lab/styrene-rs.git", rev = "5895790f8005426a1c62287ca75bfafe904ead7a" }
styrene-ipc = { git = "https://github.com/styrene-lab/styrene-rs.git", rev = "5895790f8005426a1c62287ca75bfafe904ead7a" }
styrene-ipc-server = { git = "https://github.com/styrene-lab/styrene-rs.git", rev = "5895790f8005426a1c62287ca75bfafe904ead7a" }
styrene-micron = { git = "https://github.com/styrene-lab/styrene-rs.git", rev = "5895790f8005426a1c62287ca75bfafe904ead7a" }
styrene-rns = { git = "https://github.com/styrene-lab/styrene-rs.git", rev = "5895790f8005426a1c62287ca75bfafe904ead7a" }
styrene-ui-state = { path = "crates/styrene-ui-state" }
styrene-ui-platform = { path = "crates/styrene-ui-platform" }
styrened = { git = "https://github.com/styrene-lab/styrene-rs.git", rev = "5895790f8005426a1c62287ca75bfafe904ead7a" }
styrene-ipc-client = { git = "https://github.com/styrene-lab/styrene-rs.git", rev = "5895790f8005426a1c62287ca75bfafe904ead7a" }
styrene-ipc-wire = { git = "https://github.com/styrene-lab/styrene-rs.git", rev = "5895790f8005426a1c62287ca75bfafe904ead7a" }
styrene-session = { git = "https://github.com/styrene-lab/styrene-rs.git", rev = "5895790f8005426a1c62287ca75bfafe904ead7a" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[patch.crates-io]
wry = { path = "vendor/wry" }
