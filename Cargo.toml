[workspace]
resolver = "2"
members = ["crates/styrene-ui-state"]
exclude = ["apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/styrene-lab/styrene-ui"
authors = ["Styrene Labs"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
