name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    name: Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --exclude styrene-dx --exclude styrene-mobile --exclude styrene-mobile-android --exclude styrene-mobile-ios
      - run: cargo clippy --workspace --all-targets --exclude styrene-dx --exclude styrene-mobile --exclude styrene-mobile-android --exclude styrene-mobile-ios --no-deps -- -D warnings

  desktop-linux:
    name: Desktop (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p styrene-dx
      - run: cargo clippy -p styrene-dx --all-targets --no-deps -- -D warnings -A clippy::large-enum-variant

  desktop-macos:
    name: Desktop (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p styrene-dx --all-targets

  ios-rust:
    name: iOS Rust
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-apple-ios
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p styrene-ui-apple-bridge --target aarch64-apple-ios
      - run: cargo clippy -p styrene-ui-apple-bridge --target aarch64-apple-ios --no-deps -- -D warnings
      - run: cargo check -p styrene-mobile-ios --target aarch64-apple-ios
      - run: cargo clippy -p styrene-mobile-ios --target aarch64-apple-ios --no-deps -- -D warnings
