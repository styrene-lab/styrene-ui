[package]
name = "styrene-dx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Styrene desktop operator console and protocol testing scaffold"
publish = false

[[bin]]
name = "styrene-dx"
path = "src/main.rs"

[dependencies]
# Dioxus core + platform renderer
dioxus = { workspace = true, features = ["desktop", "hooks", "launch", "document"] }

# Daemon integration through the public client and session contracts
styrene-ipc.workspace = true
styrene-ipc-client.workspace = true
styrene-ipc-wire.workspace = true
styrene-session.workspace = true
styrene-micron.workspace = true
styrene-interop-runner.workspace = true

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Native file dialogs (already pinned transitively by Dioxus)
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }

# Utilities
log.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rmpv = { workspace = true, features = ["with-serde"] }
futures-util.workspace = true
async-trait.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
dioxus-ssr.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
