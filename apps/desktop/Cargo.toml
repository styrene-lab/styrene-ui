[package]
name = "styrene-dx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Styrene desktop operator console and protocol testing scaffold"
publish = false

[[bin]]
name = "styrene-dx"
path = "src/main.rs"

[dependencies]
# Dioxus core + platform renderer
dioxus = { workspace = true, features = ["desktop", "hooks", "launch"] }

# Daemon integration (hybrid: IPC socket or embedded)
styrened.workspace = true
styrene-ipc.workspace = true
styrene-ipc-server.workspace = true
styrene-micron.workspace = true
styrene-interop-runner.workspace = true

# Protocol crates
styrene-rns = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Utilities
hex.workspace = true
log.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rmpv = { workspace = true, features = ["with-serde"] }
rmp-serde.workspace = true
rand_core = { workspace = true, features = ["getrandom"] }
futures-util.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
