[application]
name = "Styrene"
default_platform = "mobile"

[android]
identifier = "io.styrene.mesh"
min_sdk = 28
target_sdk = 35
compile_sdk = 35
short_description = "Reticulum and LXMF mesh communicator"
long_description = "Styrene is a Rust-owned Reticulum and LXMF mesh communicator."

[android.application]
uses_cleartext_traffic = false

[android.permissions]
"android.permission.INTERNET" = { description = "Connect to configured Reticulum TCP interfaces." }
"android.permission.ACCESS_NETWORK_STATE" = { description = "Report network availability without inferring Reticulum connectivity." }

[application.ios]
bundle_identifier = "io.styrene.mesh"
deployment_target = "17.0"

[bundle]
identifier = "io.styrene.mesh"
publisher = "Styrene Labs"
category = "public.app-category.social-networking"
short_description = "Reticulum and LXMF mesh communicator"
long_description = "Styrene is a Rust-owned Reticulum and LXMF mesh communicator."
