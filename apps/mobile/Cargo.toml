[package]
name = "styrene-mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
dioxus.workspace = true
serde_json.workspace = true
styrene-ui-app = { path = "../../crates/styrene-ui-app" }
styrene-ui-state.workspace = true

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
async-channel.workspace = true
styrene-ipc = { git = "https://github.com/styrene-lab/styrene-rs.git", rev = "0f85140c84267052b28e84895a1af4e6677d6eec" }
styrened = { git = "https://github.com/styrene-lab/styrene-rs.git", rev = "0f85140c84267052b28e84895a1af4e6677d6eec", default-features = false, features = ["bundled-sqlite", "mobile-keychain"] }
tokio.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
async-channel.workspace = true
manganis = { version = "=0.8.0-alpha.1" }
styrene-ipc = { git = "https://github.com/styrene-lab/styrene-rs.git", rev = "0f85140c84267052b28e84895a1af4e6677d6eec" }
styrened = { git = "https://github.com/styrene-lab/styrene-rs.git", rev = "0f85140c84267052b28e84895a1af4e6677d6eec", default-features = false, features = ["bundled-sqlite", "mobile-android-keystore"] }
tokio.workspace = true

[lints]
workspace = true
